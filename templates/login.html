<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Hygiene Pro Services 3D</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0a1628 0%, #112240 60%, #1AABE3 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    .login-logo-img {
      max-width: 220px;
      height: auto;
      display: block;
      margin: 0 auto 1.5rem;
    }
    .login-logo-fallback {
      width: 72px; height: 72px;
      background: #1AABE3;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.2rem;
    }
    .btn-hps {
      background: #1AABE3;
      border-color: #1AABE3;
      color: #fff;
      font-weight: 600;
    }
    .btn-hps:hover {
      background: #1292C4;
      border-color: #1292C4;
      color: #fff;
    }
    .form-control:focus { border-color: #1AABE3; box-shadow: 0 0 0 .2rem rgba(26,171,227,.2); }
    .input-group-text { background: #e8f6fc; border-color: #dee2e6; color: #1AABE3; }
    .divider { border-top: 1px solid #e8f0f6; margin: 1.5rem 0 1rem; }
  </style>
</head>
<body>
<div class="login-card">

  <!-- Logo HPS -->
  <img src="{{ url_for('static', filename='logo.png') }}"
       alt="Hygiene Pro Services 3D"
       class="login-logo-img"
       onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';">
  <div id="logo-fallback" class="login-logo-fallback" style="display:none;">
    <i class="bi bi-tools text-white fs-2"></i>
  </div>

  <h5 class="text-center fw-bold mb-1" style="color:#0a1628;">Hygiene Pro Services 3D</h5>
  <p class="text-center text-muted small mb-3">Agenda — Espace Administration</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
    {% endfor %}{% endif %}
  {% endwith %}

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label fw-semibold small">Identifiant</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold small">Mot de passe</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
    </div>
    <div class="mb-4 form-check">
      <input type="checkbox" class="form-check-input" name="remember" id="remember" style="accent-color:#1AABE3;">
      <label class="form-check-label small text-muted" for="remember">Rester connecté</label>
    </div>
    <button type="submit" class="btn btn-hps w-100 py-2">
      <i class="bi bi-box-arrow-in-right me-1"></i> Se connecter
    </button>
  </form>

  <div class="divider"></div>
  <p class="text-center text-muted" style="font-size:.75rem;">
    © Hygiene Pro Services 3D
  </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
