<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hors ligne — HPS3D</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #0a1628; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="text-center text-white px-4">
    <i class="bi bi-wifi-off" style="font-size:5rem;color:#1AABE3;"></i>
    <h1 class="mt-3 fw-bold">Vous êtes hors ligne</h1>
    <p class="text-secondary fs-5 mt-2">
      Cette page n'est pas disponible sans connexion.<br>
      Les bons d'intervention déjà visités restent accessibles.
    </p>
    <hr style="border-color:#1AABE3;opacity:.4;max-width:300px;margin:1.5rem auto;">
    <p class="text-secondary small">
      <i class="bi bi-info-circle me-1"></i>
      Les photos que vous prenez hors ligne sont sauvegardées localement<br>
      et envoyées automatiquement à la reconnexion.
    </p>
    <button onclick="window.history.back()"
            class="btn btn-outline-light mt-3 px-4">
      <i class="bi bi-arrow-left me-2"></i>Retour
    </button>
    <button onclick="window.location.reload()"
            class="btn mt-3 px-4 ms-2" style="background:#1AABE3;color:#fff;border:none;">
      <i class="bi bi-arrow-clockwise me-2"></i>Réessayer
    </button>
  </div>
</body>
</html>
